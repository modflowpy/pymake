name: pymake continuous integration

on:
  schedule:
    - cron: '0 6 * * *' # run at 7 AM UTC every day
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/*.md'
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  pymake-os-compiler:
    name: pymake compilers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # test latest gcc and python
          - {os: ubuntu-latest, compiler: gcc, version: 13, shell: bash, pixienv: default}
          # test the newest supported python
          - {os: ubuntu-latest, compiler: gcc, version: 13, shell: bash, pixienv: py314}
          - {os: macos-latest, compiler: gcc, version: 13, shell: bash, pixienv: default}
          - {os: windows-latest, compiler: gcc, version: 13, shell: pwsh, pixienv: build}
          # test latest python and intel-classic
          - {os: ubuntu-22.04, compiler: intel-classic, version: 2021.7, shell: bash, pixienv: default}
          - {os: windows-2022, compiler: intel-classic, version: 2021.7, shell: pwsh, pixienv: default}
          # test latest python and previous gcc
          - {os: ubuntu-latest, compiler: gcc, version: 12, shell: bash, pixienv: default}
          - {os: ubuntu-latest, compiler: gcc, version: 11, shell: bash, pixienv: default}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.75.0
          manifest-path: "pixi.toml"

      - name: pixi post-install
        working-directory: pymake
        run: |
          pixi run -e ${{ matrix.pixienv }} postinstall

      # the windows gcc job takes its compilers from the build environment,
      # since setup-fortran downloads mingw from chocolatey on every run
      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }} on ${{ matrix.os }}
        if: ${{ matrix.pixienv != 'build' }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      # the compilers have to be the ones the build environment provides
      # rather than the ones the runner image preinstalls
      - name: Report the compilers the build environment provides
        if: ${{ matrix.pixienv == 'build' }}
        run: |
          pixi run -e ${{ matrix.pixienv }} gfortran --version
          pixi run -e ${{ matrix.pixienv }} gcc --version
          pixi run -e ${{ matrix.pixienv }} g++ --version

      - name: Download examples for pytest runs
        run: |
          pixi run -e ${{ matrix.pixienv }} download-examples 
      
      # the build environment provides make, so it is only installed for a
      # job that does not use it
      - name: Install make
        if: ${{ runner.os == 'Windows' && matrix.pixienv != 'build' }}
        run: choco install make

      - name: test on Linux
        if: runner.os == 'Linux'
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest

      - name: test on MacOS
        if: runner.os == 'macOS'
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest-base

      - name: test on Windows
        if: runner.os == 'Windows'
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest-base

      - name: Run scheduled tests on MacOS and Linux with all compilers but intel-classic
        if: ${{ github.event_name == 'schedule' && (runner.os != 'Windows' || matrix.compiler != 'intel-classic') }}
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest-schedule

      - name: Run scheduled tests on Windows with intel-classic compiler
        if: ${{ github.event_name == 'schedule' && runner.os == 'Windows' && matrix.compiler == 'intel-classic' }}
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest-schedule --exclude gridgen

      # the scheduled tests build every program in one call, which is how a
      # build that works for one program on its own but not alongside another
      # is caught. they are run on one job for a pull request, since what they
      # catch is the build itself rather than the platform or the compiler
      - name: Run scheduled tests on a pull request
        if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc' && matrix.version == 13 }}
        run: |
          pixi run -e ${{ matrix.pixienv }} autotest-schedule

      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.pixienv }}
          path: ./autotest/.failed

      - name: Print coverage report before upload
        run: |
          pixi run -e ${{ matrix.pixienv }} coverage-report
  
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: ./autotest/coverage.xml
  
