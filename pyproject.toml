[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfpymake"
description = "pymake is a Python package to compile MODFLOW-based models."
readme = "README.md"
authors = [
    { name = "mfpymake Team", email = "modflow@usgs.gov" },
]
maintainers = [
    { name = "Joseph D. Hughes", email = "jdhughes@usgs.gov" },
]
keywords = ["MODFLOW", "groundwater", "hydrogeology"]
license = "CC0-1.0"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.3,<3.0",
    "requests",
    "networkx",
    "meson>=1.3.1",
    "ninja",
    "pydot",
]
dynamic = ["version"]

[project.optional-dependencies]
lint = [
    "cffconvert",
    "ruff",
]
test = [
    "mfpymake[lint]",
    "coverage!=7.6.5",
    "flaky",
    "filelock",
    "pytest!=8.1.0",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-dependency",
    "pytest-dotenv",
    "pytest-xdist",
    "appdirs",
    "matplotlib>=1.4.0",
    "modflow-devtools>=1.7.0,!=1.9.0,<2",
    "flopy",
]

[project.scripts]
mfpymake = "pymake.cmds.mfpymakecli:main"
make-program = "pymake.cmds.build:main"
make-code-json = "pymake.cmds.createjson:main"

[project.urls]
Documentation = "https://mfpymake.readthedocs.io"
"Release Notes" = "https://github.com/modflowpy/pymake/releases"
"Bug Tracker" = "https://github.com/modflowpy/pymake/issues"
"Source Code" = "https://github.com/modflowpy/pymake"

[tool.hatch.build.targets.sdist]
only-include = ["pymake"]

[tool.hatch.build.targets.wheel]
packages = ["pymake"]

[tool.hatch.version]
path = "pymake/config.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "D200", # pydocstyle - unnecessary-multiline-docstring
    "D202", # pydocstyle - blank-line-after-function
    "D209", # pydocstyle - new-line-after-last-paragraph
    "D212", # pydocstyle - multi-line-summary-first-line
    "D400", # pydocstyle - missing-trailing-period
    "D403", # pydocstyle - first-word-uncapitalized
    "D409", # pydocstyle - section-underline-matches-section-length
    "D410", # pydocstyle - no-blank-line-after-section
    "D411", # pydocstyle - no-blank-line-before-section
    "D413", # pydocstyle - missing-blank-line-after-last-section
    "E",    # pycodestyle error
    "F",    # Pyflakes
    "I001", # isort - unsorted-imports
    "RUF",  # Ruff-specific rules
    "UP",   # Pyupgrade
]
ignore = [
    "E722", # do not use bare `except`
    "E741", # ambiguous variable name
    "F841", # local variable assigned but never used
    "RUF005", # collection literal concatenation
    "RUF022", # Apply an isort-style sorting to `__all__`
    "UP015", # redundant open modes
]

[tool.codespell]
ignore-words-list = [
    "Fo",
    "nam",
]
