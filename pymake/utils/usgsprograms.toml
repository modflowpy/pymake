# Programs pymake can download and build.
#
# version            release the url points at
# current            the release pymake builds by default
# url                archive the source is downloaded from
# dirname            directory the archive extracts to, "." for the root
# srcdir             source directory within the extracted archive
# standard_precision a single precision executable is built
# double_precision   a double precision executable is built
# shared_object      a shared library is built rather than an executable

[program."mf6"]
version = "6.7.0"
current = true
url = "https://github.com/MODFLOW-ORG/modflow6/releases/download/6.7.0/mf6.7.0_linux.zip"
dirname = "mf6.7.0_linux"
srcdir = "src"
standard_precision = true
double_precision = false
shared_object = false

